[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aave-risk-monitor"
version = "0.1.0"
description = "Aave v3 Collateral Stress Monitor for LlamaRisk"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "eth-abi>=5.1.0",
    "eth-utils>=4.1.0",
    "web3>=7.2.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.27.0",
    "PyYAML>=6.0.2",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "python-telegram-bot>=21.5",
    "alembic>=1.13.0",
    "SQLAlchemy>=2.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
    "types-aiofiles>=24.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B006", "SIM108", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["risk"]
