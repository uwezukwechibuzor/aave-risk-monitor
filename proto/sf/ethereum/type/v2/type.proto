syntax = "proto3";
package sf.ethereum.type.v2;
option go_package = "github.com/streamingfast/firehose-ethereum/types/pb/sf/ethereum/type/v2;pbeth";

import "google/protobuf/timestamp.proto";

message Block {
  uint32 ver = 1;
  bytes hash = 2;
  uint64 number = 3;
  uint64 size = 4;
  BlockHeader header = 5;
  repeated BlockHeader uncles = 6;
  repeated TransactionTrace transaction_traces = 10;
  repeated BalanceChange balance_changes = 11;
  repeated CodeChange code_changes = 20;
}

message BlockHeader {
  bytes parent_hash = 1;
  bytes uncle_hash = 2;
  bytes coinbase = 3;
  bytes state_root = 4;
  bytes transactions_root = 5;
  bytes receipt_root = 6;
  bytes logs_bloom = 7;
  BigInt difficulty = 8;
  uint64 number = 9;
  uint64 gas_limit = 10;
  uint64 gas_used = 11;
  google.protobuf.Timestamp timestamp = 12;
  bytes extra_data = 13;
  bytes mix_hash = 14;
  uint64 nonce = 15;
  bytes hash = 16;
  BigInt total_difficulty = 17;
  uint64 base_fee_per_gas_offset = 18;
  BigInt base_fee_per_gas = 18000;
}

message BigInt { bytes bytes = 1; }

message TransactionTrace {
  bytes to = 1;
  uint32 nonce = 2;
  BigInt gas_price = 3;
  uint64 gas_limit = 4;
  BigInt value = 5;
  bytes input = 6;
  bytes v = 7;
  bytes r = 8;
  bytes s = 9;
  uint64 gas_used = 10;
  uint32 type = 12;
  repeated AccessTuple access_list = 14;
  bytes max_fee_per_gas = 11;
  bytes max_priority_fee_per_gas = 13;
  bytes hash = 15;
  bytes from = 16;
  TransactionReceipt receipt = 17;
  repeated Call calls = 18;
  uint32 index = 19;
  TransactionTraceStatus status = 20;
  bytes public_key = 21;
  uint64 begin_ordinal = 22;
  uint64 end_ordinal = 23;
}

enum TransactionTraceStatus {
  UNKNOWN = 0;
  SUCCEEDED = 1;
  FAILED = 2;
  REVERTED = 3;
}

message AccessTuple {
  bytes address = 1;
  repeated bytes storage_keys = 2;
}

message TransactionReceipt {
  bytes state_root = 1;
  uint64 cumulative_gas_used = 2;
  bytes logs_bloom = 3;
  repeated Log logs = 4;
}

message Log {
  bytes address = 1;
  repeated bytes topics = 2;
  bytes data = 3;
  uint32 index = 4;
  uint32 block_index = 5;
  uint64 ordinal = 6;
}

message Call {
  uint32 index = 1;
  uint32 parent_index = 2;
  uint32 depth = 3;
  CallType call_type = 4;
  bytes caller = 5;
  bytes address = 6;
  BigInt value = 7;
  uint64 gas_limit = 8;
  uint64 gas_consumed = 9;
  bytes return_data = 13;
  bytes input = 14;
  bool executed_code = 15;
  bool suicide = 16;
  repeated StorageChange storage_changes = 17;
  repeated BalanceChange balance_changes = 21;
  repeated Log logs = 24;
  bool state_reverted = 30;
  bool status_failed = 31;
  bool status_reverted = 32;
  string failure_reason = 33;
  uint64 begin_ordinal = 34;
  uint64 end_ordinal = 35;
}

enum CallType {
  UNSPECIFIED = 0;
  CALL = 1;
  CALLCODE = 2;
  DELEGATE = 3;
  STATIC = 4;
  CREATE = 5;
}

message StorageChange {
  bytes address = 1;
  bytes key = 2;
  bytes old_value = 3;
  bytes new_value = 4;
  uint64 ordinal = 5;
}

message BalanceChange {
  bytes address = 1;
  BigInt old_value = 2;
  BigInt new_value = 3;
  uint64 ordinal = 4;
  BalanceChangeReason reason = 5;
}

enum BalanceChangeReason {
  REASON_UNKNOWN = 0;
  REASON_REWARD_MINE_UNCLE = 1;
  REASON_REWARD_MINE_BLOCK = 2;
  REASON_DAO_REFUND_CONTRACT = 3;
  REASON_DAO_ADJUST_BALANCE = 4;
  REASON_TRANSFER = 5;
  REASON_GENESIS_BALANCE = 6;
  REASON_GAS_BUY = 7;
  REASON_REWARD_TRANSACTION_FEE = 8;
  REASON_REWARD_FEE_RESET = 14;
  REASON_GAS_REFUND = 9;
  REASON_TOUCH_ACCOUNT = 10;
  REASON_SUICIDE_REFUND = 11;
  REASON_SUICIDE_WITHDRAW = 13;
  REASON_CALL_BALANCE_OVERRIDE = 12;
  REASON_BURN = 15;
  REASON_WITHDRAWAL = 16;
}

message CodeChange {
  bytes address = 1;
  bytes old_hash = 2;
  bytes old_code = 3;
  bytes new_hash = 4;
  bytes new_code = 5;
  uint64 ordinal = 6;
}
